# Harness configuration (#8).
#
# PLACEHOLDER VALUES. The science agent owns the frozen parameters and delivers them under
# protocol/; every number below marked "placeholder" is replaced when they land and is frozen
# after the pilot. Nothing here may be tuned per option, layout or model.

[meta]
status = "frozen"            # amendment 38 (#140): the caps row filled the limits after the pilot (#141); past the pilot the harness refuses any other status
base_repo = "handle_4/prior_study_replication_package"
base_commit = "06223f16181d53681b17e274aa2ccaec04ffbf06"

[limits]                       # frozen after the pilot (placeholder values)
max_tool_rounds = 230          # main's round cap, the caps row (caps tool phase 2). {TURN_CAP}: tool rounds (one assistant message with tool calls = 1); ends the run as turn_cap
time_cap_s = 29400             # main's time cap, the caps row (>= 37(b)'s lower bound of 28800); the launch file's time_cap_s overrides it for every run (harness/run.py build_context) and must equal it. {TIME_CAP_MIN}; whole run, wall clock; ends the run as time_cap
token_budget = 12190000        # main's token budget, the caps row (>= 37(b)'s lower bound); no launch override exists, so this line is the cap. {TOKEN_BUDGET}: sum of input+output tokens over all model calls; ends the run as token_budget
output_cap_chars = 8000         # {OUTPUT_CAP}: characters per tool result, identical for every tool and option
max_output_tokens = 32768      # per model call, identical in every option; covers reasoning tokens (science ruling, 1 Nov). A model whose own maximum is lower
                               # sends that instead (ModelSpec.max_output_tokens in models.toml, recorded per run)

# A python cell has NO limit of its own: it is bounded only by the run's remaining time cap above (science ruling on #9, 1 Nov).

[sandbox_limits]               # per agent sandbox, identical in every option and layout (science ruling on #9, 1 Nov)
agent_memory_gib = 16          # the agent's allowance; the tool result names this value when a cell hits the memory limit
tracer_headroom_gib = 1        # the tracer's memory at real size (#9), confirmed by science on #9, 1 Nov 20:18Z: the naive
                               # whole-grid pattern peaked at 7.80 GiB untraced and 8.04 GiB traced (+0.24 GiB), so 1 GiB covers
                               # unmeasured patterns. The container limit is agent_memory_gib + tracer_headroom_gib = 17 GiB.
cpus = 4.0                     # a cap on CPU time, not a reservation (8 sandboxes x 4 on the 16-core host)
pids = 512
nofile = 1048576             # open files, soft = hard (docker's default soft limit is 1,024); same in every option

[seeds]
values = [1, 2, 3]

[network]                      # per HOST, EMPTY here (site_g's LAN addresses are unreachable from the main host)
host_aliases = {}              # name = "ipv4": --add-host on every sandbox container (docker gives containers no /etc/hosts of
                               # the host's). A host in 198.51.100.1/24 sets them in /etc/icsa-2027/host_aliases.toml, not here:
                               # a sync replaces this file. ICSA_HOST_ALIASES=name=ip,... overrides. Recorded in every run record.

provider_port = 30443          # THE route to the data provider, for every option and block: 30443 = direct to op_worker (site_g's NodePort
                               # icsa-direct), 443 = Traefik. Feeds the gate's upstream and oneclient -P in one function
                               # (icsa/sandbox/route.py). Required, no default. T's and D's fault calibration alone stays on 443 (via="traefik").


[read_check]                   # The short fixed read before each timed block (icsa/frprobe.py, tools/site_g_tests/read_check.py). Its command is built from
                               # [network] provider_port, never written anywhere, so the read cannot measure a different path from the runs.
ref_mbit = 4925.1              # Amendment 26(a), site_g's move to 32 vCPU. Source: this check on its real path: s2z/sst_s2.nc warm, direct on 30443, 8 streams, 30 s, from the
                               # quiet .23, 2 Nov about 22:25Z: 4918.2, 5016.4 and 4840.6 Mbit/s, mean 4925.1, errors {}, peers site_g's LAN address only
                               # (the read-check reference file of that run's record and the three probe records after it). It replaces
                               # 3187, the same check on the 8-vCPU site_g, which stays in the record.
drop = 0.20                    # Science (#34, 2 Nov 10:07Z, issuecomment-6574438697): a drop of more than 20% stops the block: below 3,940.08.

[scheduler]
site_id = "icsa-host"          # where the harness runs; the Onedata site comes from the sandbox metadata

[scheduler.provider_concurrency]   # set after the pilot (placeholder values)
site_a = 4
anthropic = 4                  # fallback for a Claude model with no entry below
"anthropic:claude-sonnet-5-5" = 64   # per Claude model. NOT provider limits and not measured ceilings: science (#34, 2 Nov 06:22Z) set both to 64; the input-token
"anthropic:claude-haiku-5-5" = 64    # limit (10M a minute) binds only at rates real sessions should not reach. 429s keep the registered retries and are counted per run.

[client]                       # open-weight endpoints
endpoints_file = "~/icsa-paths/endpoints.json"
request_timeout_s = 7200
connect_retries = 8            # on connection errors, 5xx, 429 (stacks hand over to new nodes)
retry_base_s = 5
retry_max_s = 120

[site_b]                       # second backend for the five open-weight models (operator decision, 1 Nov)
base_url = "https://host-26.invalid/api/v1"
key_file = "~/.agent_framework/keys/handle_4/icsa-2027/lk"   # read at use time; the value is never logged or recorded
[site_b.concurrency]           # one logical slot "site_b:<model>" per model; load-test PLACEHOLDERS
qwen = 8
glm = 8
deepseek = 2
gemma = 4
qwen-coder = 4

[anthropic]
key_file = "~/.secrets/icsa-2027/anthropic.key" # read at start-up; the value is never logged or recorded

[knowledge]                    # the knowledge-plane MCP server (#6): handle_4/onedata-mcp, pinned in protocol/knowledge/pin.json
command = "@pinned"      # the executable of the clone verified against protocol/knowledge/pin.json (icsa.knowledge.launch)
args = []
allowed_tools = ["get_file_attributes", "get_file_metadata"]   # = pin.json tools.allowed; the server itself is started with ONEDATA_MCP_TOOLS=<these>

[prompt_slots]                  # values for slots the protocol leaves to other lanes; identical across options by construction
DATASET_ID = "cmems_obs-sst_bal_phy-temp_my_l4_P1D-m"      # the Copernicus Marine dataset id of S1/S2 (icsa.ingest.common.DATASET_ID)
FS_EXPR = "fsspec.filesystem('onedata')"                   # the sandbox preconfigures the client from ONEDATA_* env (T, T-unpaginated, D)
MOUNT_ROOT = "/data"                                       # DataConfig.mount_path (M)
SCRATCH = "/work"                                          # the agent's writable home in the sandbox

[prompt_slots.S1]               # per layout, identical across options: "the directory <path>"; = icsa.sandbox.config.dataset_location
DATASET_LOCATION = "the directory `icsa2027_data_20261101T090944Z/s1z`"
MOUNT_LOCATION = "the directory `/data/icsa2027_data_20261101T090944Z/s1z`"

[prompt_slots.S2]               # "the file <path>"
DATASET_LOCATION = "the file `icsa2027_data_20261101T090944Z/s2z/sst_s2.nc`"
MOUNT_LOCATION = "the file `/data/icsa2027_data_20261101T090944Z/s2z/sst_s2.nc`"
