# The seven models (#8). One table per model.
#
# `sampling` and `reasoning` are each model's VENDOR-RECOMMENDED settings for agentic tool use
# (science agent, binding comment on #8). They are identical across options and layouts and are
# frozen before the pilot. `sources` cites where each value came from; where the vendor gives no
# recommendation the value is left out and `notes` says so -- nothing is invented.
#
# status = "frozen": the settings were frozen on 1 Nov 2026, before the pilot, with the values unchanged from the
# reviewed set (collected from the vendor sources and re-checked against the raw model cards).
# Live study runs refuse to start unless it reads "frozen" (see icsa.harness.config.assert_frozen).
#
# request_extra is merged into the API request body as-is (chat-template kwargs for the vLLM
# models, `thinking` / `output_config` for Anthropic).

[models.qwen]
reported_name = "qwen3.8-27b"
api_id = "Qwen/Qwen3.8-27B"
checkpoint = "Qwen/Qwen3.8-27B"
version_note = "bf16, rev 1d4bf0f2, vLLM 0.29.0"
version_notes = { hpc = "bf16, rev 1d4bf0f2, vLLM 0.29.0", site_b = "site_b service: vLLM build as given by the observed system_fingerprint; checkpoint and revision not stated by the service" }
kind = "openai_compat"
provider_id = "site_a"
slot_prefix = "qwen"
status = "frozen"
echo_reasoning_field = "reasoning_content"
sources = ["https://huggingface.co/Qwen/Qwen3.8-27B/raw/main/README.md line 252: \"Thinking Mode: `temperature=1.0`, `top_p=0.95`, `top_k=20`, `min_p=0.0`, `presence_penalty=0.0`, `repetition_penalty=1.0`\" (repeated at line 502)", "https://huggingface.co/Qwen/Qwen3.8-27B/raw/main/README.md line 300: `reasoning_effort=\"xhigh\",  # xhigh by default`; lines 296-297: `\"enable_thinking\": True,  # on by default`, `\"preserve_thinking\": True, # on by default`", "https://huggingface.co/Qwen/Qwen3.8-27B/raw/main/generation_config.json: \"temperature\": 1.0, \"top_k\": 20, \"top_p\": 0.95 (agrees)"]
notes = "Thinking mode is the card default; reasoning_effort left at the card default (xhigh). The card keeps historical thinking (preserve_thinking default true); the card example stores it as reasoning_content. Instruct-mode values (T=0.7 top_p=0.8 presence_penalty=1.5) exist but are not used."
[models.qwen.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[models.gemma]
reported_name = "gemma-4-31b"
api_id = "google/gemma-4-31B"
checkpoint = "RedHatAI/gemma-4-31B-it-FP8-block"   # the API id is an alias for this checkpoint
version_note = "FP8-block, rev d7242548, vLLM 0.32.0"
version_notes = { hpc = "FP8-block, rev d7242548, vLLM 0.32.0", site_b = "site_b service: vLLM build as given by the observed system_fingerprint; checkpoint and revision not stated by the service" }
kind = "openai_compat"
provider_id = "site_a"
slot_prefix = "gemma"
status = "frozen"
sources = ["https://huggingface.co/google/gemma-4-31B-it/raw/main/README.md lines 366-368: \"`temperature=1.0`\", \"`top_p=0.95`\", \"`top_k=64`\" (Sampling Parameters: standardized configuration across all use cases)", "https://huggingface.co/google/gemma-4-31B-it/raw/main/README.md line 177: \"To enable reasoning, set `enable_thinking=True`\"; line 385: \"Thoughts from previous model turns must *not be added* before the next user turn begins, with the exception of tool call turns where thinking content should be preserved.\"", "https://huggingface.co/google/gemma-4-31B-it/raw/main/generation_config.json: \"temperature\": 1.0, \"top_k\": 64, \"top_p\": 0.95 (agrees)"]
notes = "Card given for the -it checkpoint; no FP8-specific guidance checked (UNVERIFIED). Thinking default is not stated on the card; we switch it on explicitly (agentic tool use). The card names no field for returning thoughts, so none is echoed (UNVERIFIED how vLLM exposes it)."
[models.gemma.sampling]
temperature = 1.0
top_p = 0.95
top_k = 64
[models.gemma.request_extra.chat_template_kwargs]
enable_thinking = true

