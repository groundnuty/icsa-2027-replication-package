sources = ["https://host-2.invalid/docs/en/models/haiku-5-5/overview: \"Adaptive thinking is on by default. Control thinking depth with the effort parameter. Omit temperature, top_p, and top_k.\"", "https://host-2.invalid/docs/en/build-with-claude/effort: \"Claude Opus 5.5 and Claude Haiku 5.5 default to medium.\"; \"medium: Balanced approach with moderate token savings. The default on Claude Opus 5.5 and Claude Haiku 5.5.\"", "https://host-2.invalid/docs/en/build-with-claude/thinking: line 221: an encrypted copy of the full reasoning \"that you pass back unchanged in multi-turn and tool-use conversations\""]
notes = "No sampling parameters are sent: the vendor requires them omitted (the Haiku 5.5 docs say: omit temperature, top_p and top_k). No seed parameter exists. Thinking is adaptive and on by default; depth is set by output_config.effort=medium, which is the documented default for Haiku 5.5. Rationale (science agent ruling, 1 Nov): effort=medium for both Haiku 5.5 (its default) and Sonnet 5.5 (deliberately below its default of high) keeps the cheaper-and-stronger tier pair of H4 at equal effort. Thinking blocks are returned verbatim with tool results."
[models.haiku.request_extra]
thinking = { type = "adaptive" }
output_config = { effort = "medium" }
