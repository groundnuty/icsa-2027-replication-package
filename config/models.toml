[models.sonnet]
reported_name = "claude-sonnet-5-5"
api_id = "claude-sonnet-5-5"
checkpoint = "claude-sonnet-5-5"
version_note = "Anthropic Messages API; no seed parameter"
kind = "anthropic"
provider_id = "anthropic"
status = "frozen"
sources = ["https://host-2.invalid/docs/en/models/sonnet-5-5/overview: \"Setting temperature, top_p, or top_k returns a 400 error.\"", "https://host-2.invalid/docs/en/build-with-claude/effort: \"Claude Sonnet 5.5 supports all five effort levels, and high is the default on the Claude API. ... For agentic coding and multistep tool use, start with medium for well-specified tasks and move to high for harder or longer ones.\"", "https://host-2.invalid/docs/en/build-with-claude/thinking: \"Claude Sonnet 5.5 also has thinking on by default, and it rejects thinking: {type: \\\"disabled\\\"} with a 400 error. To turn off up-front thinking, send thinking: {type: \\\"between_tools\\\"} instead.\"; line 221: an encrypted copy of the full reasoning \"that you pass back unchanged in multi-turn and tool-use conversations\""]
notes = "No sampling parameters are sent: the vendor requires them omitted (Sonnet 5.5: setting them returns 400). No seed parameter exists. Thinking is adaptive; the docs reject type disabled (400) and offer between_tools as the lowest setting, which we do not use. Depth is set by output_config.effort=medium: the docs say start at medium for well-specified agentic tasks and high for harder or longer ones (the API default is high), so medium is a deliberate non-default choice, identical across options. Rationale (science agent ruling, 1 Nov): effort=medium for both Haiku 5.5 (its default) and Sonnet 5.5 (deliberately below its default of high) keeps the cheaper-and-stronger tier pair of H4 at equal effort. Thinking blocks are returned verbatim with tool results."
[models.sonnet.request_extra]
thinking = { type = "adaptive" }
output_config = { effort = "medium" }

