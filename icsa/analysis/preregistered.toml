# Every pre-registered constant of the analysis lives in this file (#14).
# Editing it changes the config hash recorded in every output manifest.
# Entries marked PLACEHOLDER wait for a protocol decision (this file is then re-frozen before the
# main runs). The instrument-audit rates are not such an entry: see [instrument_sensitivity].

[inference]
alpha = 0.05
holm_family = "contrasts_within_outcome_x_layout"
wilcoxon_zero_method = "wilcox"   # scipy: drop zero differences
wilcoxon_method = "auto"          # scipy: exact for small n without ties, else normal
zero_tolerance = 1e-12            # region differences below this are float noise: exact zeros (dropped and counted)
contrasts = [["T", "D"], ["T", "M"], ["D", "M"]]
layouts = ["S1", "S2"]
main_options = ["T", "D", "M"]

[effects]
# Smallest effects: a difference counts for the guide only if Holm-significant
# AND at least this large in absolute value.
smallest_effect_proportion = 0.10   # 10 percentage points (omission, coverage_baseline, coverage_target)
smallest_effect_cost_factor = 2.0   # tokens: ratio of at least 2 either way
# Event F1 has no pre-registered smallest effect: reported, never "counts".

[bootstrap]
B = 10000
ci_level = 0.95
ci_type = "percentile"
seed = 20270101
# Region-level cluster bootstrap: regions are resampled with replacement and the
# same resample is applied to every model; the statistic is the equal-weight
# mean over models of the per-model mean paired difference.
model_weighting = "equal"

[blocks]
# Which campaign blocks (#16) the analyses use. The primary analysis uses ONLY the blocks in
# `primary`: the 10 pilot instances are 10 of the 50 main instances, so the pilot is excluded by
# BLOCK, never by instance id. Every other block (pilot, calibration, optional_second_impl,
# optional_second_harness, anything new) is dropped from the primary analysis; the optional blocks
# get their own descriptive tables later. A row with no block is an error, not a drop.
primary = ["main", "pagination"]
# Pilot rows feed only the power re-estimate (the between-region SD of the pilot).
pilot = "pilot"
# The fault-injection fidelity table is built from #11's scripted runs, which carry no campaign
# block of the allow-list above, so it cannot use that list. It leaves out the campaign's agent-run
# blocks named here and every row flagged exclude_from_analysis (the 42-run calibration block is
# also flagged by the campaign; either marker drops a row).
never =["pilot", "calibration", "optional_second_impl", "optional_second_harness"]

[outcomes]
# Coverage is two pre-registered outcomes, never combined: coverage_baseline (share of the required
# baseline extent the agent analysed) and coverage_target (share of the required target extent).
# Each is its own Holm family (3 contrasts) per layout, with the 10-point smallest effect.
# Cost: log2(input + output tokens) per run; every later stage is a plain mean
# (seeds -> instance -> region x model -> region), so a cost effect is a mean
# log2 ratio and the reported ratio is 2 ** effect (a geometric-mean ratio).
tokens_fields = ["input_tokens", "output_tokens"]

# Denominators follow protocol/report-spec.md, "Outcome definitions and bounds" (fixed in code):
#  O/C/U = finished runs labelled omitting/complete/unknown; K = time-capped runs;
#  O'/U' = omitting/unknown runs whose report says complete == true.
#  - omission: O/(O+C); bounds O/(O+C+U+K) and (O+U+K)/(O+C+U+K);
#  - undisclosed omission: O'/(O+C+U-U'); bounds O'/(O+C+U) and (O'+U')/(O+C+U); K excluded;
#  - end-to-end over ALL runs: finished, instrument label C, correct (never the self-report);
#    upper bound adds finished, label U, correct;
#  - an instance with no seed defining the denominator is undefined for that outcome; a region
#    averages its defined instances per arm; a region undefined in either arm is dropped from
#    that contrast (count reported as n_regions_dropped); sensitivity imputes undefined as 1 and 0;
#  - event F1: finished runs on instances with events; false alarm: finished event-free runs;
#  - rows flagged exclude_from_analysis, and rows of any block outside [blocks].primary, are dropped;
#  - Wilcoxon: zero region differences are dropped (zero_method "wilcox") and counted per contrast
#    (n_zero_dropped).

[overhead]
# Scripted enforcement overhead (#12 quiet-window measurement) stated beside measured wall time.
sidecar_options = ["M"]                       # measured against an unsandboxed mount; every other option against no gate
min_k = 5                                     # fewer repeats than this is refused, not reported

[pagination]
option = "T-unpaginated"
reference_option = "T"
layout = "S1"
# PLACEHOLDER: whether seeds are 0- or 1-based is set by the harness (#8).
primary_seed = 1

[instrument_sensitivity]
# The audit (~100 agent runs per option, code inspection) needs agent runs, so its false-complete /
# false-omission rates are RESULTS of the study: they cannot be known, and are not to be written here,
# before the main runs. They enter only the sensitivity analysis of the contrasts, afterwards, from
# the audit's output file (`run_all(..., audit=PATH)` / `--instrument-audit PATH`, format in
# icsa/analysis/audit.py, rates per option x layout). Until then the scenarios below are PLACEHOLDERS
# kept only to exercise the code; every output row names its `rates_source`.
# false_complete: P(label complete | truly omitting); false_omission: P(label omitting | truly complete).
[instrument_sensitivity.scenarios.placeholder_zero]
T = { false_complete = 0.00, false_omission = 0.00 }
D = { false_complete = 0.00, false_omission = 0.00 }
M = { false_complete = 0.00, false_omission = 0.00 }
[instrument_sensitivity.scenarios.placeholder_5pct]
T = { false_complete = 0.05, false_omission = 0.02 }
D = { false_complete = 0.05, false_omission = 0.02 }
M = { false_complete = 0.05, false_omission = 0.02 }

[power]
target_regions = 25
target_difference = 0.10
sd_grid = [0.10, 0.15]
# Pointers in #14 (0.99 at SD 0.10, 0.75 at SD 0.15) are reproduced at
# alpha / n_contrasts (first Holm step); both levels are reported.
n_simulations = 5000
seed = 20270102

[mixed_models]
formula_fixed = "option * layout"   # "+ backend" is added when the data hold more than one backend (pre-registered on #8); plus crossed random intercepts for region and model (fixed in code)

[pilot_power]
# The power re-estimate uses the pilot block's between-region SD of the paired omission difference
# (layout S1), per contrast, at alpha and alpha / n_contrasts.
outcome = "omission"
layout = "S1"
