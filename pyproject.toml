[project]
name = "icsa-2027-experiments"
version = "0.1.0"
description = "Experiments for the ICSA 2027 paper: where should the agent meet the data?"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "h5py",
    "h5netcdf",
    "fsspec",
    "statsmodels",
    "openai",
    "anthropic",
    "mcp",
    "copernicusmarine",
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 900     # pytest already enables faulthandler; this also dumps the frames of a hung test
markers = [
    "docker: needs docker and passwordless sudo (loop mounts); skipped otherwise",
    "federation: needs the real SITE_AY federation (ICSA_FEDERATION=1); read-only",
    "slow: long simulation tests (tests/analysis); deselect with -m 'not slow'",
    "registered_order: needs the registered run order, not seed-first, even when ICSA_TEST_SEED_FIRST=1 (tests/conftest.py)",
    "own_process: needs a single-threaded parent; runs in its own process when other threads are alive (tests/pipeline/conftest.py)",
]
